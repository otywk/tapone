<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap One</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="inicio" class="contenedor">
    <h1>Felicidades lograste acceder</h1>
    <button class="siguiente" type="button" onclick="mostrarMenu()">Siguiente</button>
  </main>

  <main id="menu" class="menu" hidden>
    <button class="tarjeta tarjeta-izquierda" type="button" onclick="abrirPersonajes()">
      <img src="TapOne.jpg" alt="Tap One">
      <span>Tap One</span>
    </button>
    <button class="tarjeta tarjeta-derecha" type="button" onclick="seleccionar('PROXIMAMENTE')">
      <img src="PROXIMAMENTE.jpg" alt="Próximamente">
      <span>PRÓXIMAMENTE</span>
    </button>
  </main>

  <main id="seccionPersonajes" class="seccion-personajes" hidden>
    <header class="encabezado-juego">
      <button class="boton-secundario" type="button" onclick="volverMenu()">← Menú</button>
      <div class="titulo-juego">
        <h2>Tap One</h2>
        <p>Elegí una carta por ronda. Las demás cambiarán.</p>
      </div>
      <button class="boton-secundario" type="button" onclick="reiniciarPartida()">Reiniciar</button>
    </header>
    <div class="barra-estado">
      <span id="contador">Elegidos: 0/7</span>
      <span id="mensajeRonda" aria-live="polite">Elegí una tarjeta para empezar</span>
    </div>
    <div class="rejilla-personajes" id="rejillaPersonajes"></div>
  </main>

  <main id="pantallaResultado" class="pantalla-resultado" hidden>
    <h2>¡Partida terminada!</h2>
    <p>Tu puntuación final</p>
    <strong class="puntaje-total" id="puntajeTotal">0 / 42</strong>
    <div id="resumenElegidos" class="resumen-elegidos"></div>
    <section class="ranking">
      <h3>🏆 TOP 10 — mejores partidas</h3>
      <p class="nota-ranking">Ranking guardado en este navegador.</p>
      <ol id="listaRanking"></ol>
    </section>
    <div class="acciones-final">
      <button class="siguiente" type="button" onclick="reiniciarPartida()">Jugar otra vez</button>
      <button class="boton-secundario" type="button" onclick="volverMenu()">Volver al menú</button>
    </div>
  </main>
</body>
</html>
